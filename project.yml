name: Glintwake
options:
  bundleIdPrefix: com.panandafog
  developmentLanguage: en
  knownRegions: [en, ru]
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: 3HG9ZBM8AV
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Glintwake
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.puzzle-games
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Glintwake:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources: [Sources, Assets/Assets.xcassets, Resources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.panandafog.glintwake
        TARGETED_DEVICE_FAMILY: '1,2'
        SDKROOT: auto
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator macosx
        SUPPORTS_MACCATALYST: NO
        IPHONEOS_DEPLOYMENT_TARGET: '17.0'
        MACOSX_DEPLOYMENT_TARGET: '14.0'
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
        'LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]': $(inherited) @executable_path/../Frameworks
        'INFOPLIST_KEY_UILaunchScreen_Generation[sdk=iphone*]': YES
        'INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=iphone*]': YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
  GlintwakeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UITests]
    dependencies:
      - target: Glintwake
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
schemes:
  Glintwake:
    build:
      targets:
        Glintwake: all
    test:
      targets: [GlintwakeUITests]
